<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Cascadia Code', Consolas, Monaco, monospace;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Ambient Glow Radials -->
    <radialGradient id="glow-p" cx="170" cy="140" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-s" cx="550" cy="160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Glassmorphic Elements -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />

  <!-- Technical Coordinate Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="170" cy="140" r="200" fill="url(#glow-p)" />
  <circle cx="550" cy="160" r="220" fill="url(#glow-s)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="300" fill="#fb7185" />

  <!-- Left Domain Graphic Motif (x=40..310, y=30..270) -->
  
    <!-- Agents Heart: Worker Role Contracts, Assignment Gates & Lifecycle Engine -->
    <g transform="translate(45, 35)">
      <!-- Concentric Orbital Authorization Rings -->
      <circle cx="130" cy="110" r="90" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="3 5" opacity="0.3"/>
      <circle cx="130" cy="110" r="70" fill="none" stroke="#e11d48" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

      <!-- Heart Silhouette & Lifecycle Shield -->
      <path d="M 130 80 C 130 60, 95 55, 85 80 C 75 105, 110 130, 130 150 C 150 130, 185 105, 175 80 C 165 55, 130 60, 130 80 Z" 
            fill="#4c0519" fill-opacity="0.4" stroke="#fb7185" stroke-width="2.5" filter="url(#drop-shadow)"/>

      <!-- EKG Waveform traversing the heart -->
      <path d="M 35 110 H 85 L 95 90 L 110 130 L 125 70 L 135 140 L 145 100 L 155 120 L 165 110 H 225" 
            fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="125" cy="70" r="4" fill="#fb7185"/>
      <circle cx="135" cy="140" r="4" fill="#fb7185"/>

      <!-- 2 Interlocking Role Contract Keys -->
      <g transform="translate(30, 40)">
        <rect width="65" height="20" rx="4" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
        <text x="6" y="14" class="font-mono" font-size="7.5" font-weight="700" fill="#fb7185">ROLE.CLAIM</text>
      </g>
      
      <g transform="translate(165, 40)">
        <rect width="65" height="20" rx="4" fill="#0f172a" stroke="#e11d48" stroke-width="1"/>
        <text x="6" y="14" class="font-mono" font-size="7.5" font-weight="700" fill="#e11d48">ASSIGN.OK</text>
      </g>

      <!-- Fail-Closed Lifecycle Stamp at Bottom -->
      <g transform="translate(50, 180)">
        <rect width="160" height="22" rx="4" fill="#0f172a" stroke="#fb7185" stroke-width="1.2"/>
        <circle cx="14" cy="11" r="3" fill="#fb7185"/>
        <text x="25" y="15" class="font-mono" font-size="8" font-weight="700" fill="#fb7185">FAIL-CLOSED LIFECYCLE</text>
      </g>
    </g>
    

  <!-- Vertical Divider Line -->
  <line x1="330" y1="35" x2="330" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Right Branding & Meta Information (x=360..1160) -->
  <g transform="translate(360, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="308.8" height="24" rx="5" fill="#fb7185" fill-opacity="0.14" stroke="#fb7185" stroke-width="1"/>
      <text x="12" y="16" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#fb7185">ELLMOS-AI // LIFECYCLE // AGENT CONTROL</text>
    </g>

    <!-- Repository Title -->
    <text x="0" y="122" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#title-grad)">agents-heart</text>

    <!-- English Subtitle / Tagline -->
    <text x="0" y="158" class="font-sans" font-size="17" font-weight="500" fill="#94a3b8">Worker Role Contracts, Assignment Gates &amp; Lifecycle Engine</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      
        <g transform="translate(0, 0)">
          <rect width="174" height="30" rx="15" fill="#0f172a" stroke="#fb7185" stroke-width="1.2"/>
          <text x="87.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">❤️ Role Contracts</text>
        </g>
        

        <g transform="translate(186, 0)">
          <rect width="173" height="30" rx="15" fill="#0f172a" stroke="#e11d48" stroke-width="1.2"/>
          <text x="86.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🔑 Assignment Gates</text>
        </g>
        

        <g transform="translate(371, 0)">
          <rect width="181" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="90.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🔄 Lifecycle Control</text>
        </g>
        

        <g transform="translate(564, 0)">
          <rect width="152" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="76.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🛡️ Fail-Closed</text>
        </g>
        
    </g>
  </g>
</svg>